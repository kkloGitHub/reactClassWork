<section aria-labelledby="macau-heading" data-page-title="澳門觀音堂">
    <h2 id="macau-heading">澳門觀音堂</h2>
    <p>
        澳門以歷史城區與博彩娛樂聞名，融合葡式與中式風情。
        觀音堂是澳門具代表性的祭祀神廟之一。
    </p>

    <ul>
        <li>地址：澳門美副將大馬路2號</li>
        <li>開放時間：每日上午7時30分至下午5時</li>
        <li>
            主題：觀音堂不僅歷史悠久，更是中美《望廈條約》的簽署地。
        </li>
    </ul>
