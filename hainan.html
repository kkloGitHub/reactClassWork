    <h2 id="hainan-heading">海南島南海觀音</h2>
    <p>
        海南島擁有熱帶海島風情的自然景觀。
        南海觀音是海南島具代表性的海上觀音造像。
    </p>

    <ul>
        <li>地點：三亞南山文化旅遊區前的海中金剛洲人工島</li>
        <li>開放時間：每日上午8時至下午5時30分</li>
        <li>
            主題：海上觀音位於三亞市，是世界最大的海上觀音造像，
            主體高108米，為一體化三尊聖像設計。
        </li>
    </ul>
