    <h2 id="taiwan-heading">台灣大甲鎮瀾宮</h2>
    <p>
        台灣以多元文化、夜市小吃與自然風光聞名，是深度旅遊的好去處。
        大甲鎮瀾宮是台灣具代表性的祭祀神廟之一。
    </p>

    <ul>
        <li>地點：台中市大甲區順天路158號</li>
        <li>開放時間：每日上午6時至下午9時30分</li>
        <li>
            主題：大甲媽祖鎮瀾宮九天八夜遶境活動，吸引國內外遊客前來參與。
        </li>
    </ul>
