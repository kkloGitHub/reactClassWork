<section aria-labelledby="hongkong-heading" data-page-title="香港觀音廟">
    <h2 id="hongkong-heading">香港觀音廟</h2>
    <p>
        香港融合中西文化，是購物、美食與城市景觀的旅遊勝地。
        觀音廟是香港具代表性的祭祀神廟之一。
    </p>

    <ul>
        <li>地點：香港紅磡差館里15號</li>
        <li>開放時間：每日 08:00 - 17:45</li>
        <li>
            主題：觀音開庫（借庫）：每年農曆正月廿六是著名的「觀音借庫」日，
            吸引大批善信前來向觀音求財祈福，場面極為盛況。
        </li>
    </ul>
